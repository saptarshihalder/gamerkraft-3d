name: Create release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing semantic-version tag to publish (for example v0.1.0)
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate semantic version tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]
      - name: Verify tag targets this commit
        env:
          TAG: ${{ inputs.tag }}
        run: test "$(git rev-parse "$TAG^{commit}")" = "$(git rev-parse HEAD)"
      - name: Create GitHub release from changelog
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh release create "$TAG" --generate-notes --verify-tag
