<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GamerKraft Engine</title>
    <meta name="description" content="GamerKraft Engine — a browser-based 3D game engine and level editor.">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect x='8' y='8' width='84' height='84' rx='16' fill='%231f6fd1'/%3E%3Crect x='28' y='28' width='44' height='44' rx='6' fill='white'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="css/editor.css">
</head>
<body>
<div id="app">
    <header id="menubar">
        <div class="logo"><i></i>GAMERKRAFT</div>
        <nav id="menus" style="display:flex"></nav>
        <div class="spacer"></div>
        <div id="project-title"><span class="dirty-dot" title="Unsaved changes"></span><b>Untitled</b><span class="muted">GamerKraft Engine</span></div>
    </header>
    <div id="toolbar"></div>
    <main id="workspace">
        <section id="dock-left" class="dock"></section>
        <div class="splitter v" data-var="--left-w" data-dir="1"></div>
        <section id="dock-center">
            <div class="tabs"><div class="tab active"><span id="vp-tab-icon"></span>Viewport</div></div>
            <div id="viewport" tabindex="0">
                <div class="vp-bar left" id="vp-left"></div>
                <div class="vp-bar right" id="vp-right"></div>
                <div id="vp-stats" class="hidden"></div>
                <svg id="vp-axis" viewBox="-30 -30 60 60"></svg>
                <div id="vp-hint"></div>
                <div id="pie-banner">PLAY IN EDITOR &nbsp;&bull;&nbsp; Esc: pause &nbsp;&bull;&nbsp; Esc again / F10: stop</div>
            </div>
        </section>
        <div class="splitter v" data-var="--right-w" data-dir="-1"></div>
        <section id="dock-right">
            <div class="panel" id="outliner-panel"></div>
            <div class="splitter h" data-var="--outliner-h" data-dir="1" data-parent="dock-right"></div>
            <div class="panel" id="details-panel"></div>
        </section>
    </main>
    <div class="splitter h" data-var="--bottom-h" data-dir="-1"></div>
    <section id="dock-bottom" class="panel"></section>
    <footer id="statusbar"></footer>
</div>
<div id="toasts"></div>

<script src="src/boot.js"></script>
<script src="vendor/three.gk.js"></script>
<script src="vendor/lucide.min.js"></script>
<script src="src/core/util.js"></script>
<script src="src/core/blocks.js"></script>
<script src="src/core/world.js"></script>
<script src="src/render/voxel-material.js"></script>
<script src="src/render/mesher.js"></script>
<script src="src/render/sky.js"></script>
<script src="src/core/actors.js"></script>
<script src="src/render/engine.js"></script>
<script src="src/render/rt-scene.js"></script>
<script src="src/render/pathtracer.js"></script>
<script src="src/render/render-output.js"></script>
<script src="src/runtime/systems.js"></script>
<script src="src/runtime/hud.js"></script>
<script src="src/runtime/game.js"></script>
<script src="src/runtime/player.js"></script>
<script src="src/editor/ui.js"></script>
<script src="src/editor/editor.js"></script>
<script src="src/editor/panels.js"></script>
<script src="src/editor/templates.js"></script>
<script src="src/editor/render-studio.js"></script>
<script src="src/editor/app.js"></script>
</body>
</html>
